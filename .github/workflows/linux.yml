name: Linux local terminal checks
on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      package:
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: linux-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}
jobs:
  build-test-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.cache/zig-global
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: |
            .cache/tools
            .cache/upstream
            .cache/zig-global
            .zig-cache
          key: local-terminal-${{ runner.os }}-${{ hashFiles('deps.lock.json', 'build.zig', 'patches/**') }}
      - name: Native GUI test runtime
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 libcairo2-dev libglib2.0-dev xvfb strace fonts-dejavu-core fonts-wqy-zenhei binutils
      - name: Locked dependencies and Zig 0.17.0
        run: python3 tools/bootstrap.py
      - name: Build baseline and verify local VT/PTY
        run: python3 tools/build.py --skip-bootstrap
      - name: Audit Linux 3.10 and glibc 2.17 delivery ABI
        run: python3 tools/audit-elf.py zig-out/linux/bin --output .cache/verification/linux-abi.json
      - name: Hidden local-terminal UI checks
        run: xvfb-run -a python3 tools/verify-ui.py --prefix=linux
      - name: Hidden GUI with statx unavailable
        run: xvfb-run -a strace -f -e inject=statx:error=ENOSYS -o .cache/verification/statx-enosys.log python3 tools/verify-ui.py --prefix=linux
      - name: Preserve test evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: letty-local-terminal-evidence-${{ github.sha }}
          path: |
            .cache/verification
            .cache/test-logs
          if-no-files-found: warn
          retention-days: 14
      - name: Require a completed port release gate
        if: inputs.package
        run: |
          echo 'The local-terminal rewrite is a development port. Full feature and target acceptance must be implemented before publishing a release.' >&2
          exit 1
