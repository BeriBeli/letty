name: Linux build and checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: Verify the current developer release receipt and package a candidate
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-test-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/.cache/zig-global
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Runner and host information
        run: |
          mkdir -p .cache/test-logs
          printf 'ImageOS=%s\nImageVersion=%s\n' "$ImageOS" "$ImageVersion" | tee .cache/test-logs/runner.txt
          uname -a | tee -a .cache/test-logs/runner.txt
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .cache/tools
            .cache/upstream
            .cache/zig-global
          key: el7-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deps.lock.json', 'patches/**', 'tools/build.py') }}
      - name: Host runtime for GUI checks
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-0t64 xvfb xdotool strace fonts-dejavu-core fonts-wqy-zenhei binutils vim
      - name: Locked sources and Zig 0.17
        run: python3 tools/bootstrap.py
      - name: Build explicit Linux 3.10 / glibc 2.17 baseline, run core checks
        shell: bash
        run: |
          set -o pipefail
          python3 tools/build.py --skip-bootstrap 2>&1 | tee .cache/test-logs/build.log
      - name: Audit all shipped ELF files
        run: python3 tools/audit-elf.py zig-out/linux/bin --output .cache/test-logs/abi-audit.json
      - name: GTK smoke and simulated missing statx
        shell: bash
        run: |
          set -o pipefail
          xvfb-run -a tools/gui-smoke.sh | tee .cache/test-logs/gui-summary.txt
          mkdir -p .cache/statx-config
          export XDG_CONFIG_HOME="$PWD/.cache/statx-config"
          xvfb-run -a strace -f -e inject=statx:error=ENOSYS -o .cache/test-logs/statx-enosys.log zig-out/linux/bin/letty --no-restore --hold --smoke-ms=1000 '--command=printf "Old kernel file path 中文\n"; sleep 30'
      - name: Complete hidden UI regression evidence
        run: xvfb-run -a python3 tools/verify-ui.py --prefix=linux
      - name: Native golden regression
        run: python3 tools/verify-vt-goldens.py --skip-build --prefix=zig-out/linux
      - name: Configuration includes and conditional-theme CLI checks
        run: python3 tools/verify-config-cli.py --prefix=linux
      - name: Verify native release against developer receipt
        if: github.event_name == 'workflow_dispatch' && inputs.release
        run: python3 tools/verify-native-release.py --ci --receipt docs/native-release-acceptance.json
      - name: Package the checked binaries
        if: github.event_name == 'workflow_dispatch' && inputs.release
        run: python3 tools/package.py --ci
      - name: Upload verification logs and any gated candidate
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: letty-el7-${{ github.sha }}
          path: |
            dist/*.tar.gz
            dist/SHA256SUMS
            .cache/test-logs/
            .cache/verification/
          if-no-files-found: error
          retention-days: 14
